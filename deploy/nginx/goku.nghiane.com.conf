# Goku Trượt Băng - reverse proxy tới container app (127.0.0.1:8090).
# Chứng chỉ Let's Encrypt cấp bằng acme.sh (webroot):
#   /root/.acme.sh/acme.sh --issue -d goku.nghiane.com -w /usr/share/nginx/html --keylength ec-256

map $http_upgrade $goku_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream goku_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goku.nghiane.com;
    charset utf-8;

    ssl_certificate /root/.acme.sh/goku.nghiane.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/goku.nghiane.com_ecc/goku.nghiane.com.key;
    include /etc/nginx/ssl_config.conf;

    # Cloudflare ở chế độ Flexible gọi về cổng 80 kèm X-Forwarded-Proto: https.
    # Chỉ chuyển hướng khi người dùng thật sự vào bằng http.
    set $goku_redirect "";
    if ($scheme = http) { set $goku_redirect "1"; }
    if ($http_x_forwarded_proto = "https") { set $goku_redirect ""; }
    if ($request_uri ~ "^/.well-known/acme-challenge/") { set $goku_redirect ""; }
    if ($goku_redirect = "1") { return 301 https://goku.nghiane.com$request_uri; }

    access_log off;
    error_log /var/log/nginx/goku.nghiane.com.error.log;

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    # WebSocket của game: tắt buffer, giữ kết nối lâu
    location /ws {
        proxy_pass http://goku_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $goku_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://goku_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        gzip on;
        gzip_types application/json application/javascript text/css image/svg+xml application/octet-stream;
    }
}
